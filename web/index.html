<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành JavaScript</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
        }

        input {
            padding: 8px;
        }

        #output {
            margin-top: 16px;
            padding: 12px;
            background: #f3f3f3;
            border-radius: 6px;
            min-height: 40px;
        }
    </style>
</head>

<body>
    <h1>Thực hành JavaScript</h1>

    <p>Nhập tên của bạn:</p>
    <input type="text" id="nameInput" placeholder="Ví dụ: Nam" />
    <button id="greetBtn">Chào</button>

    <div id="output">Kết quả sẽ hiện ở đây...</div>

    <p>Mở Console (F12 → tab Console) để xem kết quả của console.log.</p>

    <!-- Đặt script ở cuối body để HTML load xong trước -->
    <script src="main.js"></script>
</body>

</html>
